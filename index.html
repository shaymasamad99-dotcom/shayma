<title>تمريني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, app-style — bottom tab bar, week strip, expandable exercise rows */
:root {
  --bg: #F2F3F0;
  --surface: #FFFFFF;
  --ink: #1A1E1C;
  --muted: #5D6660;
  --line: #DCE0DB;
  --accent: #2B7A57;
  --accent-ink: #FFFFFF;
  --soft: #E2EEE7;
  --warn: #9A5B12;
  --display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #1A201D; --ink: #ECEFEC; --muted: #9AA59F;
    --line: #2A322E; --accent: #5CC092; --accent-ink: #0D1310; --soft: #1D3128; --warn: #E0A35C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #1A201D; --ink: #ECEFEC; --muted: #9AA59F;
  --line: #2A322E; --accent: #5CC092; --accent-ink: #0D1310; --soft: #1D3128; --warn: #E0A35C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 110px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .78rem; letter-spacing: .04em; color: var(--muted); }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: .9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; }

.scheme { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.scheme div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.scheme b { display: block; font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.scheme span { font-size: .78rem; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px; text-align: center; font-size: .78rem; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.day i { font-style: normal; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.day.train i { background: var(--accent); }
.day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .today { font-size: .65rem; color: var(--accent); font-weight: 600; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 4px; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ex { border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; }
.ex-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: 0; text-align: start; }
.ex-num { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-family: var(--display); font-size: .9rem; }
.ex-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ex-main b { font-weight: 600; }
.ex-meta { font-size: .8rem; color: var(--muted); }
.ex-sets { flex: none; font-family: var(--display); font-size: .9rem; font-variant-numeric: tabular-nums; direction: ltr; }
.ex-body { padding: 0 14px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-body ol { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.tip { font-size: .85rem; color: var(--warn); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.video { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; }
.pill { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }

.rest { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 6px; }

.search { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { display: flex; flex-direction: column; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 24px; }

form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.num { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: start; display: flex; flex-direction: column; }
.opt small { color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
.save { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 14px; font-weight: 600; font-size: 1rem; }
.err { color: var(--warn); font-size: .85rem; }
.note { font-size: .8rem; color: var(--muted); }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabs-in { display: flex; width: 100%; max-width: 560px; }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 4px; font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tabs button[aria-current="true"] { color: var(--accent); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .ex-body { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(-3px); } } }
</style>

<div class="app" dir="rtl" lang="ar" id="app"></div>

</nav>

<script>
/* ===================== البيانات ===================== */
const MUSCLES = {
  chest:     { ar: "الصدر",          part: "upper", kw: "صدر بنش" },
  back:      { ar: "الظهر",          part: "upper", kw: "ظهر لاتس" },
  shoulders: { ar: "الأكتاف",        part: "upper", kw: "كتف اكتاف كتوف" },
  biceps:    { ar: "الباي (أمامي)",  part: "upper", kw: "باي بايسبس ايد يد زند ذراع" },
  triceps:   { ar: "التراي (خلفي)",  part: "upper", kw: "تراي ترايسبس ايد يد زند ذراع" },
  quads:     { ar: "الفخذ الأمامي",  part: "lower", kw: "فخد فخذ رجل رجلين ارجل سكوات امامي" },
  hamstrings:{ ar: "الفخذ الخلفي",   part: "lower", kw: "فخد فخذ رجل رجلين ارجل خلفي هامسترنج" },
  glutes:    { ar: "الأرداف",        part: "lower", kw: "ارداف مؤخره جلوتس ورك رجل" },
  calves:    { ar: "السمانة",        part: "lower", kw: "سمانه بطه ساق رجل" },
  abs:       { ar: "البطن",          part: "core",  kw: "بطن معده كور خصر جذع" },
};
const EQ = { db: "دمبل", machine: "ماشين", body: "وزن الجسم" };
const PARTS = { upper: "علوي", lower: "سفلي", core: "بطن" };

const EX = [
  // الصدر
  { id:"db-bench", m:"chest", eq:"db", ar:"ضغط صدر بالدمبل", en:"Dumbbell Bench Press",
    steps:["استلقي عالبنش والدمبلين عند صدرك، الكوعين بزاوية ٤٥ درجة تقريباً.","ادفعي لفوق لحتى تقرب إيديك من بعض بدون ما تقفلي الكوع.","نزّلي ببطء لمستوى الصدر."], tip:"خلي لوحي الكتف ملزوقين بالبنش وما ترفعي ظهرك." },
  { id:"db-incline", m:"chest", eq:"db", ar:"ضغط صدر عالي بالدمبل", en:"Incline Dumbbell Press",
    steps:["ارفعي البنش لزاوية ٣٠ درجة.","ادفعي الدمبلين لفوق باتجاه أعلى الصدر.","نزّلي بتحكّم لحد ما تحسي بشد بالصدر."], tip:"زاوية عالية كتير بتحوّل الشغل عالكتف." },
  { id:"db-fly", m:"chest", eq:"db", ar:"فتح صدر بالدمبل", en:"Dumbbell Chest Fly",
    steps:["استلقي والدمبلين فوق صدرك، الكوع مثني شوي.","افتحي إيديك عالجنبين متل كأنك عم تحضني شجرة.","رجعي سكّري لفوق وأنتي عاصرة الصدر."], tip:"وزن خفيف، الحركة من الكتف مش من الكوع." },
  { id:"m-chestpress", m:"chest", eq:"machine", ar:"جهاز ضغط الصدر", en:"Machine Chest Press",
    steps:["ظبطي الكرسي لتكون المسكات بمستوى نص الصدر.","ادفعي لقدام لحتى تفرد إيديك تقريباً.","رجعي ببطء بدون ما يلمس الوزن تحت."], tip:"ضهرك ملزوق بالمسند طول الوقت." },
  { id:"m-pecdeck", m:"chest", eq:"machine", ar:"جهاز الفراشة", en:"Pec Deck Machine",
    steps:["اقعدي وظبطي المسكات بمستوى الصدر.","سكّري إيديك لقدام وأنتي عاصرة الصدر.","افتحي ببطء لحد ما تحسي بشد خفيف."], tip:"ما ترجعي لورا أكتر من مستوى الكتف." },
  { id:"m-crossover", m:"chest", eq:"machine", ar:"كروس أوفر بالكيبل", en:"Cable Crossover",
    steps:["وقفي بالنص بين البكرتين، خطوة لقدام.","اسحبي المسكات لتحت ولقدام لحتى يلتقوا قدام صدرك.","رجعي ببطء."], tip:"ميلي جسمك لقدام شوي وثبتي الكوع." },
  { id:"pushup", m:"chest", eq:"body", ar:"تمرين الضغط", en:"Push Up",
    steps:["إيديك أعرض من كتافك شوي، جسمك خط مستقيم.","نزلي صدرك لقرب الأرض.","ادفعي لفوق."], tip:"إذا صعب، اعمليه عالركب أو عحفة بنش." },
  // الظهر
  { id:"db-row", m:"back", eq:"db", ar:"سحب دمبل بإيد وحدة", en:"One Arm Dumbbell Row",
    steps:["حطي ركبة وإيد عالبنش، ضهرك مستقيم.","اسحبي الدمبل باتجاه خصرك.","نزلي ببطء لحد ما تفرد الإيد."], tip:"فكري إنك عم تسحبي بالكوع مش بالإيد." },
  { id:"db-chestrow", m:"back", eq:"db", ar:"سحب دمبل عالبنش المايل", en:"Chest Supported Dumbbell Row",
    steps:["نامي عبطنك عبنش مايل ٣٠ درجة.","اسحبي الدمبلين لفوق وعصري لوحي الكتف.","نزلي بتحكم."], tip:"مريح للضهر لأنو الصدر مسنود." },
  { id:"m-pulldown", m:"back", eq:"machine", ar:"سحب عالي (لات بول داون)", en:"Lat Pulldown",
    steps:["امسكي البار أعرض من كتافك واقعدي ثابتة.","اسحبي البار لأعلى صدرك وصدرك لفوق.","رجعي ببطء لفوق."], tip:"ما تسحبي ورا راسك وما تتمرجحي." },
  { id:"m-cablerow", m:"back", eq:"machine", ar:"سحب أرضي بالكيبل", en:"Seated Cable Row",
    steps:["اقعدي ورجليكي عالمسند، ضهرك مستقيم.","اسحبي المسكة لبطنك وعصري ضهرك.","رجعي ببطء وأنتي محافظة عوقفتك."], tip:"الجسم ثابت، الحركة من الإيدين والضهر." },
  { id:"m-assistpull", m:"back", eq:"machine", ar:"عقلة بالمساعدة", en:"Assisted Pull Up Machine",
    steps:["اختاري وزن مساعدة (كل ما زاد الوزن صار أسهل).","اطلعي لحتى يوصل دقنك فوق البار.","نزلي ببطء لآخر الحركة."], tip:"قللي المساعدة مع الوقت لتوصلي للعقلة العادية." },
  { id:"m-straightarm", m:"back", eq:"machine", ar:"سحب بإيدين مفرودين", en:"Straight Arm Pulldown",
    steps:["وقفي قدام الكيبل، إيديك مفرودين شبه كامل.","اسحبي البار لتحت لحد فخادك.","رجعي ببطء لفوق."], tip:"حسي الشغل تحت الإبط (اللاتس)." },
  { id:"superman", m:"back", eq:"body", ar:"سوبرمان", en:"Superman Exercise",
    steps:["نامي عبطنك وإيديك لقدام.","ارفعي إيديك ورجليكي سوا عن الأرض.","اثبتي ثانيتين ونزلي."], tip:"ممتاز لأسفل الضهر، الحركة صغيرة." },
  // الأكتاف
  { id:"db-shpress", m:"shoulders", eq:"db", ar:"ضغط كتف بالدمبل", en:"Dumbbell Shoulder Press",
    steps:["اقعدي عبنش ضهرو واقف، الدمبلين بمستوى الكتف.","ادفعي لفوق راسك.","نزلي لمستوى الأذن."], tip:"ما تقوّسي ضهرك، شدي بطنك." },
  { id:"db-lateral", m:"shoulders", eq:"db", ar:"رفرفة جانبي", en:"Dumbbell Lateral Raise",
    steps:["وقفي والدمبلين عجنبك.","ارفعي إيديك عالجنبين لمستوى الكتف.","نزلي ببطء."], tip:"وزن خفيف وكوع مثني شوي، بلا مرجحة." },
  { id:"db-reardelt", m:"shoulders", eq:"db", ar:"رفرفة خلفي", en:"Dumbbell Rear Delt Fly",
    steps:["ميلي لقدام وضهرك مستقيم.","افتحي إيديك عالجنبين لفوق.","نزلي بتحكم."], tip:"للكتف الخلفي، بيحسّن الوقفة." },
  { id:"m-shpress", m:"shoulders", eq:"machine", ar:"جهاز ضغط الكتف", en:"Machine Shoulder Press",

  { id:"m-cablelateral", m:"shoulders", eq:"machine", ar:"رفرفة جانبي بالكيبل", en:"Cable Lateral Raise",
    steps:["وقفي جنب الكيبل وامسكي المسكة بالإيد البعيدة.","ارفعي إيدك عالجنب لمستوى الكتف.","نزلي ببطء وبدّلي الجهة."], tip:"الكيبل بيعطي شد ثابت طول الحركة." },
  { id:"m-revpec", m:"shoulders", eq:"machine", ar:"فراشة عكسي", en:"Reverse Pec Deck",
    steps:["اقعدي ووجّك عالجهاز.","افتحي إيديك لورا عالجنبين.","رجعي ببطء."], tip:"للكتف الخلفي وأعلى الضهر." },
  // الباي
  { id:"db-curl", m:"biceps", eq:"db", ar:"تبادل دمبل باي", en:"Dumbbell Bicep Curl",
    steps:["وقفي والكوع لازق بجنبك.","ارفعي الدمبل لكتفك ولفّي الكف لفوق.","نزلي ببطء لآخر الحركة."], tip:"الكوع ثابت، بلا مرجحة بالضهر." },
  { id:"db-hammer", m:"biceps", eq:"db", ar:"هامر باي", en:"Hammer Curl",
    steps:["امسكي الدمبل والكف لجوا (متل المطرقة).","ارفعي لكتفك.","نزلي ببطء."], tip:"بيشتغل عالساعد كمان." },
  { id:"m-cablecurl", m:"biceps", eq:"machine", ar:"باي بالكيبل", en:"Cable Bicep Curl",
    steps:["وقفي قدام الكيبل والبار تحت.","ارفعي البار لصدرك.","نزلي ببطء."], tip:"شد ثابت طول الحركة." },
  { id:"m-preacher", m:"biceps", eq:"machine", ar:"جهاز باي بريتشر", en:"Machine Preacher Curl",
    steps:["حطي إيديك عالمسند.","اسحبي لفوق وعصري الباي.","نزلي ببطء بدون ما تقفلي الكوع بقوة."], tip:"بيعزل الباي بدون غش." },
  // التراي
  { id:"db-overhead", m:"triceps", eq:"db", ar:"تراي خلف الراس بالدمبل", en:"Overhead Dumbbell Triceps Extension",
    steps:["امسكي دمبل بالإيدين فوق راسك.","نزلي الدمبل لورا راسك بثني الكوع.","افردي لفوق."], tip:"الكوعين لقدام ومش مفتوحين كتير." },
  { id:"db-kickback", m:"triceps", eq:"db", ar:"كيك باك تراي", en:"Dumbbell Triceps Kickback",

  { id:"m-pushdown", m:"triceps", eq:"machine", ar:"تراي بالكيبل (بوش داون)", en:"Triceps Pushdown",
    steps:["وقفي قدام الكيبل والحبل أو البار فوق.","ادفعي لتحت لحد ما تفردي إيديك.","رجعي لمستوى الصدر."], tip:"الكوع لازق بجنبك طول الوقت." },
  { id:"bench-dips", m:"triceps", eq:"body", ar:"غطس عالبنش", en:"Bench Dips",

  // الفخذ الأمامي

const GOALS = {
  fat:      { ar: "خسارة دهون",  sub: "حرق وشد",         sets: "3",   reps: "12–15", rest: "45–60 ث" },
  muscle:   { ar: "بناء عضل",    sub: "تضخيم وشكل",      sets: "3–4", reps: "8–12",  rest: "60–90 ث" },
  strength: { ar: "قوة",         sub: "أوزان أثقل",       sets: "4",   reps: "5–6",   rest: "2–3 د" },
  fit:      { ar: "لياقة عامة",  sub: "صحة ونشاط",       sets: "2–3", reps: "10–12", rest: "60 ث" },
};
const DAYS = ["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
const DAYS_SHORT = ["سبت","أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة"];

const TEMPLATES = {
  full:  { ar: "جسم كامل",                 slots: ["quads","chest","back","hamstrings","shoulders","abs","glutes"] },
  upper: { ar: "الجزء العلوي",             slots: ["chest","back","shoulders","chest","back","biceps","triceps"] },
  lower: { ar: "الجزء السفلي",             slots: ["quads","hamstrings","glutes","quads","calves","abs"] },
  push:  { ar: "دفع: صدر، كتف، تراي",      slots: ["chest","shoulders","chest","shoulders","triceps","triceps"] },
  pull:  { ar: "سحب: ظهر، باي",            slots: ["back","back","shoulders","biceps","biceps","abs"] },
  legs:  { ar: "رجلين وأرداف",             slots: ["quads","hamstrings","glutes","quads","calves","abs"] },
};
function splitFor(n) {
  if (n <= 3) return Array.from({ length: n }, (_, i) => "full");
  if (n === 4) return ["upper","lower","upper","lower"];
  if (n === 5) return ["upper","lower","push","pull","legs"];
  return ["push","pull","legs","push","pull","legs"];
}

/* ===================== الحالة ===================== */
const DEFAULT = { age: 25, weight: 60, goal: "muscle", level: "beginner", days: [0,2,4], eq: "both", saved: false };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let profile = store.get("tamrini.profile", DEFAULT);
let dayEq = store.get("tamrini.dayEq", {});     // معدات كل يوم
let swaps = store.get("tamrini.swaps", {});     // التبديلات
const todayIdx = (new Date().getDay() + 1) % 7; // السبت = 0
let selDay = profile.days.includes(todayIdx) ? todayIdx : (profile.days[0] ?? todayIdx);
let open = null;
let tab = "plan";
let lib = { q: "", part: "all", eq: "all" };

/* ===================== المنطق ===================== */
function candidates(muscle, eq) {
  const of = (e) => EX.filter(x => x.m === muscle && e.includes(x.eq));
  let list = eq === "both" ? of(["db","machine"]) : of([eq]);
  list = list.concat(of(["body"]));
  return list.length ? list : EX.filter(x => x.m === muscle);
}
function buildDay(day) {
  const order = profile.days.slice().sort((a,b) => a - b);
  const pos = order.indexOf(day);
  if (pos < 0) return null;
  const tKey = splitFor(order.length)[pos];
  const t = TEMPLATES[tKey];
  const eq = dayEq[day] || profile.eq;
  let slots = t.slots.slice();
  if (profile.level === "beginner") slots = slots.slice(0, slots.length - 1);
  const used = new Set();
  const items = slots.map((m, i) => {
    const list = candidates(m, eq).filter(x => !used.has(x.id));
    const pool = list.length ? list : candidates(m, eq);
    const off = (pos + (swaps[`${day}-${i}-${eq}`] || 0)) % pool.length;
    const ex = pool[off];
    used.add(ex.id);
    return { ex, slot: i, isTime: ex.id === "plank" };
  });
  return { title: t.ar, eq, items };
}
const norm = (s) => s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْ]/g,"").trim();
const video = (ex) => "https://www.youtube.com/results?search_query=" + encodeURIComponent(ex.en + " proper form");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ===================== الواجهة ===================== */
const $app = document.getElementById("app");

function exRow(ex, idx, setsTxt, key, swapKey) {
  const isOpen = open === key;
  return `<div class="ex">
    <button class="ex-head" data-open="${key}" aria-expanded="${isOpen}">
      ${idx != null ? `<span class="ex-num">${idx}</span>` : ""}
      <span class="ex-main"><b>${esc(ex.ar)}</b><span class="ex-meta">${MUSCLES[ex.m].ar} · ${EQ[ex.eq]}</span></span>
      ${setsTxt ? `<span class="ex-sets">${setsTxt}</span>` : `<span class="pill">${PARTS[MUSCLES[ex.m].part]}</span>`}
    </button>
    ${isOpen ? `<div class="ex-body">
      <span class="small muted" dir="ltr" style="text-align:right">${esc(ex.en)}</span>
      <ol>${ex.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <p class="tip">نصيحة: ${esc(ex.tip)}</p>
      <div class="actions">
        <a class="video" href="${video(ex)}" target="_blank" rel="noopener">▶ شوفي الفيديو</a>
        ${swapKey ? `<button class="ghost" data-swap="${swapKey}">بدّلي التمرين</button>` : ""}
      </div>
    </div>` : ""}
  </div>`;
}

function renderPlan() {

  html += `<div class="scheme">
      <div><b>${sets}</b><span>مجموعات</span></div>
      <div><b>${g.reps}</b><span>تكرار</span></div>
      <div><b>${g.rest}</b><span>راحة</span></div>

  html += `<div class="week" role="tablist">${DAYS_SHORT.map((d, i) => `
      <button class="day ${profile.days.includes(i) ? "train" : ""} ${i === selDay ? "sel" : ""}" data-day="${i}" aria-selected="${i === selDay}">
        <span>${d}</span><i></i>${i === todayIdx ? `<span class="today">اليوم</span>` : ""}
      </button>`).join("")}</div>`;
  if (!day) {
    html += `<div class="rest"><h2>${DAYS[selDay]}: يوم راحة</h2><p class="muted">العضل بيكبر وقت الراحة. مشي خفيف ٢٠–٣٠ دقيقة أو تمطيط بيكفّي.</p></div>`;
  } else {
    html += `<section style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h2>${DAYS[selDay]}: ${day.title}</h2><span class="small muted">${day.items.length} تمارين</span>
      </div>
      <div class="seg" role="group" aria-label="المعدات">
        ${[["db","دمبل"],["machine","ماشين"],["both","التنين"]].map(([k,l]) => `<button data-eq="${k}" aria-pressed="${day.eq === k}">${l}</button>`).join("")}
      </div>
      <div class="list">${day.items.map((it, i) => exRow(it.ex, i + 1, it.isTime ? `${sets} × 30ث` : `${sets} × ${g.reps}`, `p-${selDay}-${i}`, `${selDay}-${i}-${day.eq}`)).join("")}</div>
      <p class="note">اضغطي عأي تمرين لتشوفي الشرح والفيديو. ابدئي بإحماء ٥–١٠ دقايق${profile.age >= 50 ? "، وخدي إحماء أطول وأوزان أخف بالأول" : ""}.</p>
    </section>`;
  }
  const protein = Math.round(profile.weight * 1.6), water = (profile.weight * 0.035).toFixed(1);
  html += `<section class="scheme" style="grid-template-columns:1fr 1fr">
      <div><b>${protein} غ</b><span>بروتين باليوم (تقريباً)</span></div>
      <div><b>${water} ل</b><span>مي باليوم (تقريباً)</span></div>
    </section>
    <p class="note">أرقام تقريبية عامة. إذا عندك حالة صحية، استشيري دكتور قبل ما تبلّشي.</p>`;
  return html;
}

function renderLib() {
  const q = norm(lib.q);
  const match = EX.filter(ex => {
    const M = MUSCLES[ex.m];
    if (lib.part !== "all" && M.part !== lib.part) return false;
    if (lib.eq !== "all" && ex.eq !== lib.eq) return false;
    if (!q) return true;
    const hay = norm(`${ex.ar} ${ex.en} ${M.ar} ${M.kw} ${PARTS[M.part]}`);
    return q.split(/\s+/).every(w => hay.includes(w));
  });
  const groups = {};
  match.forEach(ex => (groups[ex.m] ||= []).push(ex));
  let html = `<header style="display:flex;flex-direction:column;gap:4px">
      <span class="eyebrow">${EX.length} تمرين</span><h1>مكتبة التمارين</h1></header>
    <input id="lib-q" class="search" type="search" placeholder="اكتبي منطقة: صدر، ظهر، فخد، بطن، أرداف…" value="${esc(lib.q)}">
    <div class="chips">${[["all","الكل"],["upper","علوي"],["lower","سفلي"],["core","بطن"]].map(([k,l]) => `<button class="chip" data-part="${k}" aria-pressed="${lib.part===k}">${l}</button>`).join("")}</div>
    <div class="chips">${[["all","كل المعدات"],["db","دمبل"],["machine","ماشين"],["body","وزن الجسم"]].map(([k,l]) => `<button class="chip" data-leq="${k}" aria-pressed="${lib.eq===k}">${l}</button>`).join("")}</div>`;
  const keys = Object.keys(MUSCLES).filter(k => groups[k]);
  if (!keys.length) html += `<p class="empty">ما في تمارين بهالاسم. جربي «صدر» أو «فخد».</p>`;
  keys.forEach(k => {
    html += `<section class="group"><h3>${MUSCLES[k].ar} <span class="small muted">· ${groups[k].length}</span></h3>
      <div class="list">${groups[k].map(ex => exRow(ex, null, null, `l-${ex.id}`, null)).join("")}</div></section>`;
  });
  return html;
}

let draft = null;
function renderMe() {
  draft ||= JSON.parse(JSON.stringify(profile));
  const d = draft;
  return `<header style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">بياناتك</span><h1>ملفي</h1></header>

      <div class="seg">${[["db","دمبل"],["machine","ماشين"],["both","التنين"]].map(([k,l]) => `<button type="button" data-feq="${k}" aria-pressed="${d.eq===k}">${l}</button>`).join("")}</div>

function render() {
  $app.innerHTML = tab === "plan" ? renderPlan() : tab === "lib" ? renderLib() : renderMe();
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab));
}

/* ===================== الأحداث ===================== */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { tab = ds.tab; open = null; if (tab === "me") draft = null; render(); window.scrollTo(0,0); return; }
  if (ds.open) { open = open === ds.open ? null : ds.open; render(); return; }
  if (ds.day) { selDay = +ds.day; open = null; render(); return; }
  if (ds.eq) { dayEq[selDay] = ds.eq; store.set("tamrini.dayEq", dayEq); open = null; render(); return; }
  if (ds.swap) { swaps[ds.swap] = (swaps[ds.swap] || 0) + 1; store.set("tamrini.swaps", swaps); render(); return; }
  if (ds.part) { lib.part = ds.part; render(); return; }
  if (ds.leq) { lib.eq = ds.leq; render(); return; }
  if (ds.goal) { draft.goal = ds.goal; render(); return; }
  if (ds.level) { draft.level = ds.level; render(); return; }
  if (ds.feq) { draft.eq = ds.feq; render(); return; }
  if (ds.fday) {
    const i = +ds.fday, s = new Set(draft.days);
    if (s.has(i)) s.delete(i); else if (s.size < 6) s.add(i);
    draft.days = [...s].sort((a,b) => a-b); render(); return;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "lib-q") {
    lib.q = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById("lib-q"); el.focus(); try { el.setSelectionRange(pos, pos); } catch {}
  }
  if (e.target.id === "f-age") draft.age = +e.target.value;
  if (e.target.id === "f-weight") draft.weight = +e.target.value;
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "me-form") return;
  e.preventDefault();
  const err = document.getElementById("me-err");
  const bad = !(draft.age >= 12 && draft.age <= 90) ? "اكتبي عمر بين ١٢ و٩٠."
    : !(draft.weight >= 30 && draft.weight <= 250) ? "اكتبي وزن بين ٣٠ و٢٥٠ كغ."
    : !draft.days.length ? "اختاري يوم تمرين واحد عالأقل." : "";
  if (bad) { err.textContent = bad; err.hidden = false; return; }
  profile = { ...draft, saved: true };
  store.set("tamrini.profile", profile);
  dayEq = {}; swaps = {}; store.set("tamrini.dayEq", dayEq); store.set("tamrini.swaps", swaps);
  selDay = profile.days.includes(todayIdx) ? todayIdx : profile.days[0];
  tab = "plan"; open = null; render(); window.scrollTo(0,0);
});

render();
</script>

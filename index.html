<style>
/* Layout: one narrow column, app-style — bottom tab bar, week strip, expandable exercise rows */
:root {
  --bg: #F2F3F0;
  --surface: #FFFFFF;
  --ink: #1A1E1C;
  --muted: #5D6660;
  --line: #DCE0DB;
  --accent: #2B7A57;
  --accent-ink: #FFFFFF;
  --accent-2: #3F9C73;
  --chart: #1F8A5B;
  --soft: #E2EEE7;
  --warn: #9A5B12;
  --display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D0B; --surface: #151A17; --ink: #EEF1EE; --muted: #9AA59F;
    --line: #252D29; --accent: #5CC092; --accent-ink: #0D1310; --accent-2: #3E9F75; --chart: #5CC092; --soft: #1D3128; --warn: #E0A35C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D0B; --surface: #151A17; --ink: #EEF1EE; --muted: #9AA59F;
  --line: #252D29; --accent: #5CC092; --accent-ink: #0D1310; --accent-2: #3E9F75; --chart: #5CC092; --soft: #1D3128; --warn: #E0A35C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button, a, summary, input { touch-action: manipulation; }
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .78rem; letter-spacing: .04em; color: var(--muted); }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: .9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 16px; min-height: 40px; font-weight: 600; }

.scheme { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.scheme div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.scheme b { display: block; font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.scheme span { font-size: .78rem; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px; text-align: center; font-size: .78rem; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.day i { font-style: normal; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.day.train i { background: var(--accent); }
.day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .today { font-size: .65rem; color: var(--accent); font-weight: 600; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 4px; min-height: 40px; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ex { border-top: 1px solid var(--line); }
.ex:first-child { border-top: 0; }
.ex-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: 0; text-align: start; }
.ex-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ex-main b { font-weight: 600; }
.ex-meta { font-size: .8rem; color: var(--muted); }
.ex-sets { flex: none; font-family: var(--display); font-size: .9rem; font-variant-numeric: tabular-nums; direction: ltr; }
.ex-body { padding: 0 14px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-body ol { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.tip { font-size: .85rem; color: var(--warn); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.video { min-height: 40px; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
.ghost { min-height: 40px; display: inline-flex; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; color: var(--ink); text-decoration: none; }
.pill { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }

/* بطاقة الأسبوع */
.hero { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-radius: 20px; padding: 16px 18px; display: flex; gap: 16px; align-items: center; }
.ring { flex: none; width: 76px; height: 76px; position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke: currentColor; }
.ring .track { opacity: .25; }
.ring .val { stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring b { font-family: var(--display); font-size: 1.25rem; direction: ltr; line-height: 1; }
.hero-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hero-txt .eyebrow { color: inherit; opacity: .85; }
.hero-txt h2 { font-size: 1.15rem; }
.hero-txt p { font-size: .88rem; opacity: .92; }

/* تقدّم اليوم */
.daybar { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.daybar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .9rem; }
.daybar-top b { font-family: var(--display); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
.daybar.all { background: var(--soft); border-color: var(--accent); }
.daybar.all .daybar-top { color: var(--accent); font-weight: 600; }

/* صف التمرين مع علامة الإنجاز */
.ex-row { display: flex; align-items: center; }
.ex-row .ex-head { padding-inline-start: 10px; }
.ex.is-done .ex-main b { color: var(--muted); }
.wtag { color: var(--accent); font-weight: 600; unicode-bidi: isolate; white-space: nowrap; }

/* تسجيل الوزن */
.logbox { background: var(--bg); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.35rem; line-height: 1; color: var(--accent); }
.wbox { flex: 1; position: relative; }
.wbox .num { text-align: center; font-family: var(--display); font-size: 1.25rem; padding: 8px 34px; height: 46px; direction: ltr; }
.wbox .unit { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); font-size: .8rem; color: var(--muted); pointer-events: none; }
.done-btn { border: 0; border-radius: 12px; padding: 12px; min-height: 48px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.done-btn[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
.day.full i { width: 14px; height: 14px; display: grid; place-items: center; color: var(--accent-ink); font-size: .6rem; font-weight: 700; }
.day.part i { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); width: 9px; height: 9px; }
@media (prefers-reduced-motion: no-preference) { .pop { animation: pop .35s ease-out; } @keyframes pop { 40% { transform: scale(1.2); } } }

/* صفحة التقدّم */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile span { font-size: .8rem; color: var(--muted); }
.tile b { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile b em { font-style: normal; font-size: 1rem; color: var(--muted); }
.tile small { font-size: .75rem; color: var(--muted); }
.up { color: var(--accent); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--body); }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-base { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.c-ax { fill: var(--muted); font-size: 10px; }
.c-now { fill: var(--ink); font-weight: 600; }
.c-val { fill: var(--ink); font-size: 11px; font-weight: 600; }
.c-bar { fill: var(--chart); opacity: .55; }
.c-bar.now { opacity: 1; }
.c-line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-area { fill: var(--chart); opacity: .1; }
.c-dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.c-hit { fill: transparent; cursor: pointer; outline: none; }
.c-hit.on, .c-hit:focus-visible { fill: var(--ink); fill-opacity: .06; }
.spark { flex: none; width: 72px; height: 28px; overflow: visible; }
.tooltip { position: fixed; z-index: 20; background: var(--ink); color: var(--bg); font-size: .82rem; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap; direction: rtl; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.tbl summary { font-size: .82rem; color: var(--muted); cursor: pointer; padding: 10px 0; }
.tbl table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 6px; }
.tbl th, .tbl td { text-align: start; padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl th { color: var(--muted); font-weight: 500; }

/* دوائر التمارين */
.av { flex: none; position: relative; width: 52px; height: 52px; border-radius: 50%; background: var(--c); border: 0; padding: 0; display: grid; place-items: center; color: #fff; }
.av.lt { color: #1A1E1C; }
.av svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.av-done { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--surface) inset; }
.av-done svg { width: 26px; height: 26px; stroke: var(--accent-ink); stroke-width: 3; }
.av-uni { position: absolute; top: -3px; inset-inline-end: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); color: var(--ink); font-size: .72rem; line-height: 1; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface), 0 1px 4px rgb(0 0 0 / .25); }
.av:disabled { opacity: .7; cursor: default; }
.av.big { width: 96px; height: 96px; }
.av.big svg { width: 46px; height: 46px; }
.ex-row > .av { margin-inline-start: 14px; }
.ex-head .av { width: 44px; height: 44px; }
.ex-head .av svg { width: 22px; height: 22px; }
@media (prefers-reduced-motion: no-preference) { [data-pop] { animation: pop .35s ease-out; } }

/* عدّاد المجموعات بالصف */
.rstep { flex: none; display: flex; align-items: center; gap: 4px; margin-inline-end: 12px; }
.rstep button { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; background: var(--soft); color: var(--accent); font-size: 1.15rem; line-height: 1; display: grid; place-items: center; }
.rstep button::before { content: ""; position: absolute; inset: -7px -3px; }
.rv { min-width: 46px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.rv b { font-family: var(--display); font-size: 1.05rem; font-variant-numeric: tabular-nums; direction: ltr; }
.rv small { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.routine { display: flex; flex-direction: column; gap: 12px; }
.routine-h { display: flex; flex-direction: column; gap: 2px; text-align: center; padding-block: 4px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.routine-h .eyebrow { font-weight: 600; letter-spacing: .02em; }
.routine-h h2 { font-size: 1.35rem; }

/* زر البداية الثابت */
.startbar { position: fixed; left: 0; right: 0; z-index: 4; bottom: var(--tabh, 70px); display: flex; justify-content: center;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 55%, transparent); pointer-events: none; }
.start { pointer-events: auto; width: 100%; max-width: 528px; min-height: 56px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .22); }
.start small { font-family: var(--body); font-size: .82rem; font-weight: 500; opacity: .85; }
.start.soft { background: var(--soft); color: var(--accent); }
.start:disabled { background: var(--line); color: var(--muted); box-shadow: none; }
body.has-start .app { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }

/* وضع التمرين */
#play { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; display: flex; justify-content: center; overscroll-behavior: contain; }
#play[hidden] { display: none; }
body.playing { overflow: hidden; }
.pl { width: 100%; max-width: 560px; min-height: 100%; height: max-content; display: flex; flex-direction: column; gap: 14px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pl-top { display: flex; align-items: center; justify-content: space-between; font-family: var(--display); font-weight: 500; }
.pl-x { width: 44px; height: 44px; border: 0; background: none; font-size: 1.4rem; color: var(--ink); display: grid; place-items: center; }
.pl-segs { display: flex; gap: 4px; }
.pl-segs i { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
.pl-segs i.f { background: var(--accent); }
.pl-segs i.c { background: var(--accent); opacity: .45; }
.pl-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding-block: 8px; }
.pl-head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pl-name { font-size: 1.5rem; }
.pl-pill { background: var(--soft); color: var(--accent); font-weight: 600; font-size: .85rem; border-radius: 999px; padding: 4px 14px; }
.pl-target { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.pl-target b { font-family: var(--display); font-size: 3rem; font-variant-numeric: tabular-nums; }
.pl-target span { color: var(--muted); }
.pl-w { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: start; }
.pl-w .lbl { font-weight: 600; font-size: .9rem; }
.pl-how { width: 100%; max-width: 420px; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.pl-how summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--accent); }
.pl-how[open] { padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.pl-how ol { margin: 0; padding-inline-start: 20px; }
.pl-how .video { align-self: flex-start; }
.pl-ring { position: relative; width: min(240px, 66vw); aspect-ratio: 1; display: grid; place-items: center; }
.pl-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.pl-ring circle { fill: none; stroke-width: 12; }
.pl-ring .track { stroke: var(--soft); }
.pl-ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.pl-ring div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pl-time { font-family: var(--display); font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; direction: ltr; }
.pl-ring span { color: var(--muted); font-size: .85rem; max-width: 150px; }
.pl-next { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; text-align: start; width: 100%; max-width: 380px; }
.pl-next span { display: flex; flex-direction: column; }
.pl-actions { display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: 0; z-index: 1; margin-inline: -16px; padding: 12px 16px calc(4px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.pl-row { display: flex; gap: 10px; }
.ghost.wide { flex: 1; justify-content: center; min-height: 50px; font-weight: 600; }
.pl-end .tiles { width: 100%; text-align: start; }
.pl-trophy { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.pl-trophy svg { width: 52px; height: 52px; fill: none; stroke: var(--accent-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: no-preference) { .pl-trophy { animation: pop .5s ease-out; } }
@media (max-height: 640px) { .av.big { width: 84px; height: 84px; } .av.big svg { width: 40px; height: 40px; } .pl-target b { font-size: 2.4rem; } .pl-main { gap: 10px; } }

.rest { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 6px; }

.search { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; min-height: 40px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { display: flex; flex-direction: column; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 24px; }

form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.num { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: start; display: flex; flex-direction: column; }
.opt small { color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
.save { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 14px; font-weight: 600; font-size: 1rem; }
.err { color: var(--warn); font-size: .85rem; }
.note { font-size: .8rem; color: var(--muted); }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

  upper: { ar: "الجزء العلوي",             slots: ["chest","back","shoulders","chest","back","biceps","triceps"] },
  lower: { ar: "الجزء السفلي",             slots: ["glutes","quads","hamstrings","glutes","calves","abs","abs"] },
  push:  { ar: "دفع: صدر، كتف، تراي",      slots: ["chest","shoulders","chest","shoulders","triceps","triceps"] },
  pull:  { ar: "سحب: ظهر، باي",            slots: ["back","back","shoulders","biceps","biceps","abs"] },
  legs:  { ar: "رجلين وأرداف",             slots: ["glutes","quads","glutes","hamstrings","calves","calves","abs"] },
};
function splitFor(n) {
  if (n <= 3) return Array.from({ length: n }, (_, i) => "full");
  if (n === 4) return ["upper","lower","upper","lower"];
  if (n === 5) return ["upper","lower","push","pull","legs"];
  return ["push","pull","legs","push","pull","legs"];
}

const DEFAULT = { age: 25, weight: 60, goal: "muscle", level: "beginner", days: [0,2,4], eq: "both", saved: false };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let profile = store.get("tamrini.profile", DEFAULT);
let log = store.get("tamrini.log", {});          // { "YYYY-MM-DD": { exId: { done, w } } }
let dayEq = store.get("tamrini.dayEq", {});     // معدات كل يوم
let swaps = store.get("tamrini.swaps", {});     // التبديلات

function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  const dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#0A0D0B" : "#2B7A57");
}

/* ===================== السجل ===================== */
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
function dateOfDay(i, weekOffset = 0) { const d = new Date(TODAY); d.setDate(d.getDate() - todayIdx + i + 7 * weekOffset); return d; }
const entry = (date, id) => (log[date] || {})[id];
function setEntry(date, id, patch) {
  const day = (log[date] ||= {});
  const e = { ...(day[id] || {}), ...patch };
  if (!(e.w > 0)) delete e.w;
  if (!e.done) delete e.done;
  if (Object.keys(e).length) day[id] = e; else delete day[id];
  if (!Object.keys(day).length) delete log[date];
  store.set("tamrini.log", log);
}
const weightsOf = (id) => Object.keys(log).sort().filter(d => log[d][id] && log[d][id].w > 0).map(d => ({ d, w: log[d][id].w }));
const lastBefore = (id, date) => { const h = weightsOf(id).filter(x => x.d < date); return h.length ? h[h.length - 1].w : null; };
const bestOf = (id, before) => { const h = weightsOf(id).filter(x => !before || x.d < before); return h.length ? Math.max(...h.map(x => x.w)) : null; };
const daysWord = (n) => n === 1 ? "يوم واحد" : n === 2 ? "يومين" : `${n} أيام`;
const rng = (t) => String(t).replace(/(\d+–\d+)/g, '<bdi dir="ltr">$1</bdi>');
const fmtW = (w) => `${Math.round(w * 10) / 10} كغ`;
function weekStats(offset = 0) {
  let days = 0, ex = 0;
  for (let i = 0; i < 7; i++) {
    const d = log[ymd(dateOfDay(i, offset))] || {};
    const n = Object.values(d).filter(e => e.done).length;
    ex += n; if (n) days++;
  }
  return { days, ex };
}
const QUOTES = [

/* ===================== المنطق ===================== */
function candidates(muscle, eq) {
  const of = (e) => EX.filter(x => x.m === muscle && e.includes(x.eq));
  let list = eq === "both" ? of(["db","machine"]) : of([eq]);
  list = list.concat(of(["body"]));
  return list.length ? list : EX.filter(x => x.m === muscle);
}
function buildDay(day) {
  const order = profile.days.slice().sort((a,b) => a - b);
  const pos = order.indexOf(day);
  if (pos < 0) return null;
  const tKey = splitFor(order.length)[pos];
  const t = TEMPLATES[tKey];
  const eq = dayEq[day] || profile.eq;
  let slots = t.slots.slice();
  if (profile.level === "beginner") slots = slots.slice(0, slots.length - 1);
  const used = new Set();
  const items = slots.map((m, i) => {
    const list = candidates(m, eq).filter(x => !used.has(x.id));
    const pool = list.length ? list : candidates(m, eq);
    const off = (pos + (swaps[`${day}-${i}-${eq}`] || 0)) % pool.length;
    const ex = pool[off];
    used.add(ex.id);
    return { ex, slot: i, isTime: !!ex.time };
  });
  return { title: t.ar, eq, items };
}
const norm = (s) => s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْ]/g,"").trim();
const video = (ex) => ex.yt ? "https://www.youtube.com/watch?v=" + ex.yt : search(ex);
const search = (ex) => "https://www.youtube.com/results?search_query=" + encodeURIComponent(ex.en + " proper form");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const MCOL = { chest: "#E76F51", back: "#2A9D8F", shoulders: "#F4A261", biceps: "#8E7DBE", triceps: "#B565A7", quads: "#457B9D", hamstrings: "#3D5A80", glutes: "#D9668A", calves: "#6A994E", abs: "#E9C46A" };

function avatar(ex, opts = {}) {

  const inner = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[ex.eq]}</svg>${done ? `<span class="av-done">${CHECK}</span>` : ""}${UNI.has(ex.id) ? `<span class="av-uni" aria-hidden="true">⇄</span>` : ""}`;
  const cls = `av ${MLIGHT.has(ex.m) ? "lt" : ""} ${big ? "big" : ""} ${done ? "on" : ""}`;
  return attrs ? `<button class="${cls}" style="--c:${MCOL[ex.m]}" ${attrs}>${inner}</button>` : `<span class="${cls}" style="--c:${MCOL[ex.m]}">${inner}</span>`;
}

let adj = store.get("tamrini.adj", {});            // { "day-exId": { sets, hold } }
const REST_SEC = { fat: 50, muscle: 75, strength: 150, fit: 60 };
function baseSets() { const [a, b] = GOALS[profile.goal].sets.split("–").map(Number); return profile.level === "inter" && b ? b : a; }
const setsFor = (day, ex) => (adj[`${day}-${ex.id}`] || {}).sets ?? baseSets();
const holdFor = (day, ex) => (adj[`${day}-${ex.id}`] || {}).hold ?? 30;
const mmss = (s) => `${Math.floor(s / 60)}:${pad(Math.round(s % 60))}`;
function estMin(day, items) {
  let s = 0;
  items.forEach(it => {
    const n = setsFor(day, it.ex), work = (it.isTime ? holdFor(day, it.ex) : 40) * (UNI.has(it.ex.id) ? 2 : 1);
    s += n * work + (n - 1) * REST_SEC[profile.goal] + 60;
  });
  return Math.max(5, Math.round(s / 300) * 5);
}
function rowStepper(it, day) {
  const ex = it.ex, n = setsFor(day, ex), g = GOALS[profile.goal];
  const [kind, val, sub, lbl] = it.isTime
    ? ["hold", mmss(holdFor(day, ex)), `× ${n}`, "ثواني الثبات"]
    : ["sets", n, `× ${rng(g.reps)}`, "عدد المجموعات"];
  return `<div class="rstep" role="group" aria-label="${lbl}: ${esc(ex.ar)}">
      <button type="button" data-adj="${kind}" data-aid="${ex.id}" data-dir="-1" aria-label="أقل">−</button>
      <span class="rv"><b>${val}</b><small>${sub}</small></span>
      <button type="button" data-adj="${kind}" data-aid="${ex.id}" data-dir="1" aria-label="أكتر">+</button>

}

function dayStatus(i) {
  const day = buildDay(i); if (!day) return "";
  const d = ymd(dateOfDay(i));
  const n = day.items.filter(it => (entry(d, it.ex.id) || {}).done).length;
  return n === 0 ? "" : n >= day.items.length ? "full" : "part";
}
function ring(frac, label) {
  const r = 32, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<div class="ring" role="img" aria-label="${label}"><svg viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="${r}"/><circle class="val" cx="38" cy="38" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - f)).toFixed(1)}"/></svg><b>${Math.round(f * 100)}%</b></div>`;
}

function renderLib() {
  const q = norm(lib.q);
  const match = EX.filter(ex => {
    const M = MUSCLES[ex.m];
    if (lib.part !== "all" && M.part !== lib.part) return false;
    if (lib.eq !== "all" && ex.eq !== lib.eq) return false;
    if (!q) return true;
    const hay = norm(`${ex.ar} ${ex.en} ${M.ar} ${M.kw} ${PARTS[M.part]}`);
    return q.split(/\s+/).every(w => hay.includes(w));
  });
  const groups = {};
  match.forEach(ex => (groups[ex.m] ||= []).push(ex));
  let html = `<header style="display:flex;flex-direction:column;gap:4px">
      <span class="eyebrow">${EX.length} تمرين</span><h1>مكتبة التمارين</h1></header>

    <div class="chips">${[["all","الكل"],["upper","علوي"],["lower","سفلي"],["core","بطن"]].map(([k,l]) => `<button class="chip" data-part="${k}" aria-pressed="${lib.part===k}">${l}</button>`).join("")}</div>
    <div class="chips">${[["all","كل المعدات"],["db","دمبل"],["machine","ماشين"],["body","وزن الجسم"]].map(([k,l]) => `<button class="chip" data-leq="${k}" aria-pressed="${lib.eq===k}">${l}</button>`).join("")}</div>`;
  const keys = Object.keys(MUSCLES).filter(k => groups[k]);
  if (!keys.length) html += `<p class="empty">ما في تمارين بهالاسم. جربي «صدر» أو «فخد».</p>`;

/* ===================== صفحة التقدّم ===================== */
let progOpen = null;
const dm = (d) => `${d.getDate()}/${d.getMonth() + 1}`;
const parseD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const niceStep = (span) => { const raw = span / 3, p = Math.pow(10, Math.floor(Math.log10(raw || 1))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => k >= raw) || raw; };
const r1 = (n) => Math.round(n * 10) / 10;

function streakWeeks() {
  let n = 0, off = weekStats(0).days ? 0 : -1;      // أسبوع هلّق ما بيكسر السلسلة إذا بعدو ما بلّش
  while (n < 104 && weekStats(off).days > 0) { n++; off--; }
  return n;
}
function totalDone() { return Object.values(log).reduce((a, d) => a + Object.values(d).filter(e => e.done).length, 0); }

function barPath(x, y, w, h) {
  const r = Math.min(4, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function weeklyChart() {
  const N = 8, W = 340, H = 190, top = 22, bot = 28, axisW = 26, plotL = 4, plotR = W - axisW;
  const weeks = Array.from({ length: N }, (_, k) => {
    const off = k - (N - 1), s = dateOfDay(0, off);
    return { off, label: off === 0 ? "هالأسبوع" : dm(s), full: off === 0 ? "هالأسبوع" : `أسبوع ${dm(s)}`, ...weekStats(off) };
  });
  const max = Math.max(...weeks.map(w => w.ex)), step = niceStep(Math.max(max, 6)), yMax = Math.ceil(Math.max(max, 6) / step) * step;
  const ph = H - top - bot, y = (v) => top + ph - (v / yMax) * ph, band = (plotR - plotL) / N, bw = Math.min(24, band - 10);
  let g = "";
  for (let v = 0; v <= yMax + 1e-9; v += step) g += `<line class="c-grid" x1="${plotL}" x2="${plotR}" y1="${y(v)}" y2="${y(v)}"/><text class="c-ax" x="${plotR + 6}" y="${y(v) + 3.5}" text-anchor="start">${r1(v)}</text>`;
  const maxIdx = max > weeks[N - 1].ex ? weeks.findIndex(w => w.ex === max) : -1;
  weeks.forEach((w, i) => {
    const cx = plotR - band * (i + 0.5) - 0, x = cx - bw / 2;  // الأحدث عالشمال: i=7 → أقصى الشمال
    const h = y(0) - y(w.ex), tip = `${w.full}: ${w.ex} تمرين · ${w.days} ${w.days === 1 ? "يوم" : "أيام"}`;
    if (w.ex > 0) g += `<path class="c-bar ${w.off === 0 ? "now" : ""}" d="${barPath(x, y(w.ex), bw, h)}"/>`;
    if ((w.off === 0 || i === maxIdx) && w.ex > 0) g += `<text class="c-val" x="${cx}" y="${y(w.ex) - 6}" text-anchor="middle">${w.ex}</text>`;
    g += `<text class="c-ax ${w.off === 0 ? "c-now" : ""}" x="${cx}" y="${H - 10}" text-anchor="middle">${w.label}</text>`;
    g += `<rect class="c-hit" x="${cx - band / 2}" y="${top}" width="${band}" height="${ph + bot}" data-tip="${tip}" tabindex="0" role="img" aria-label="${tip}"/>`;
  });
  g += `<line class="c-base" x1="${plotL}" x2="${plotR}" y1="${y(0)}" y2="${y(0)}"/>`;
  const table = weeks.slice().reverse().map(w => `<tr><td>${w.full}</td><td>${w.ex}</td><td>${w.days}</td></tr>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="عدد التمارين اللي خلّصتيها بآخر ${N} أسابيع">${g}</svg>
    <details class="tbl"><summary>شوفي الأرقام كجدول</summary><table><thead><tr><th>الأسبوع</th><th>تمارين</th><th>أيام</th></tr></thead><tbody>${table}</tbody></table></details>`;
}

function spark(pts) {
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><circle class="c-dot" cx="36" cy="14" r="4"/></svg>`;
  const ws = pts.map(p => p.w), lo = Math.min(...ws), hi = Math.max(...ws), sp = hi - lo || 1;
  const xy = pts.map((p, i) => [70 - (i / (pts.length - 1)) * 68, 24 - ((p.w - lo) / sp) * 20]);
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><polyline class="c-line" points="${xy.map(p => p.join(",")).join(" ")}"/><circle class="c-dot" cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>`;
}

function weightChart(ex, pts) {
  const W = 340, H = 180, top = 24, bot = 26, axisW = 30, plotL = 26, plotR = W - axisW;
  const ws = pts.map(p => p.w), mn = Math.min(...ws), mx = Math.max(...ws);
  const step = niceStep(Math.max(mx - mn, 3)), lo = Math.max(0, Math.floor(mn / step) * step - (mx === mn ? step : 0)), hi = Math.ceil(mx / step) * step + (mx === mn ? step : 0);
  const ph = H - top - bot, y = (v) => top + ph - ((v - lo) / (hi - lo)) * ph;
  const t = pts.map(p => parseD(p.d).getTime()), t0 = t[0], t1 = t[t.length - 1];
  const inset = 14, x = (ti) => t1 === t0 ? (plotL + plotR) / 2 : plotR - inset - ((ti - t0) / (t1 - t0)) * (plotR - plotL - 2 * inset);
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="c-grid" x1="${plotL}" x2="${plotR}" y1="${y(v)}" y2="${y(v)}"/><text class="c-ax" x="${plotR + 6}" y="${y(v) + 3.5}" text-anchor="start">${r1(v)}</text>`;
  const xy = pts.map((p, i) => [x(t[i]), y(p.w)]);
  if (xy.length > 1) {
    g += `<path class="c-area" d="M${xy[0][0]},${y(lo)}L${xy.map(p => p.join(",")).join("L")}L${xy[xy.length - 1][0]},${y(lo)}Z"/>`;
    g += `<polyline class="c-line" points="${xy.map(p => p.join(",")).join(" ")}"/>`;
  }
  xy.forEach((p, i) => {
    const tip = `${dm(parseD(pts[i].d))}: ${fmtW(pts[i].w)}`;
    g += `<circle class="c-dot" cx="${p[0]}" cy="${p[1]}" r="4"/><circle class="c-hit" cx="${p[0]}" cy="${p[1]}" r="14" data-tip="${tip}" tabindex="0" role="img" aria-label="${tip}"/>`;
  });
  const L = xy[xy.length - 1];
  g += `<text class="c-val" x="${Math.max(L[0], plotL + 14)}" y="${L[1] - 10}" text-anchor="middle">${r1(pts[pts.length - 1].w)}</text>`;
  g += `<text class="c-ax" x="${plotR}" y="${H - 8}" text-anchor="end">${dm(parseD(pts[0].d))}</text>`;
  if (pts.length > 1) g += `<text class="c-ax" x="${plotL}" y="${H - 8}" text-anchor="start">${dm(parseD(pts[pts.length - 1].d))}</text>`;
  const table = pts.slice().reverse().map(p => `<tr><td>${dm(parseD(p.d))}</td><td>${fmtW(p.w)}</td></tr>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="تطوّر وزن ${esc(ex.ar)} بالكيلو">${g}</svg>
    ${pts.length < 2 ? `<p class="note">سجّلي وزن هالتمرين مرة تانية لتشوفي خط التطوّر.</p>` : ""}
    <details class="tbl"><summary>شوفي الأرقام كجدول</summary><table><thead><tr><th>التاريخ</th><th>الوزن</th></tr></thead><tbody>${table}</tbody></table></details>`;
}

function renderProgress() {
  const now = weekStats(0), prev = weekStats(-1), goal = profile.days.length, total = totalDone(), streak = streakWeeks();
  const diff = now.ex - prev.ex;
  let html = `<header style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">شوفي قدّيش وصلتي</span><h1>تقدّمي</h1></header>`;
  if (!total && !Object.keys(log).length) {
    return html + `<div class="rest"><h2>بعد ما في تمارين مسجّلة</h2><p class="muted">علّمي ✓ عالتمارين اللي بتخلّصيها بـ«برنامجي» وسجّلي أوزانك، وهون رح تشوفي تقدّمك أسبوع بأسبوع.</p><button class="save" data-tab="plan" style="margin-top:6px">روحي عالبرنامج</button></div>`;
  }
  html += `<div class="tiles">
      <div class="tile"><span>تمارين هالأسبوع</span><b>${now.ex}</b><small class="${diff > 0 ? "up" : ""}">${diff > 0 ? `▲ ${diff} أكتر من الأسبوع الماضي` : diff < 0 ? `${-diff} أقل من الأسبوع الماضي` : "متل الأسبوع الماضي"}</small></div>
      <div class="tile"><span>أيام التمرين</span><b>${now.days}<em>/${goal}</em></b><small class="${now.days >= goal ? "up" : ""}">${now.days >= goal ? "✓ حققتي هدف الأسبوع" : `باقي ${daysWord(goal - now.days)}`}</small></div>
      <div class="tile"><span>أسابيع ورا بعض</span><b>${streak}</b><small>${streak >= 2 ? "استمرارية حلوة، كمّلي!" : "كل أسبوع بتتمرني فيه بيزيد السلسلة"}</small></div>
      <div class="tile"><span>مجموع التمارين</span><b>${total}</b><small>من أول يوم</small></div>
    </div>`;
  html += `<section class="card"><div class="card-h"><h2>التمارين بالأسبوع</h2><span class="small muted">آخر ٨ أسابيع</span></div>${weeklyChart()}<p class="note">اضغطي عأي عمود لتشوفي الرقم.</p></section>`;

  const ids = [...new Set(Object.values(log).flatMap(d => Object.keys(d).filter(id => d[id].w > 0)))];
  const items = ids.map(id => ({ ex: EX.find(e => e.id === id), pts: weightsOf(id) })).filter(x => x.ex)
    .sort((a, b) => b.pts[b.pts.length - 1].d.localeCompare(a.pts[a.pts.length - 1].d));
  html += `<section class="group"><div class="card-h"><h2>تطوّر أوزاني</h2><span class="small muted">${items.length} تمرين</span></div>`;
  if (!items.length) html += `<p class="empty">سجّلي الوزن اللي بترفعيه بكل تمرين، وهون بيطلعلك خط التطوّر.</p>`;
  else {
    if (progOpen === null || (progOpen && !items.some(x => x.ex.id === progOpen))) progOpen = items[0].ex.id;
    html += `<div class="list">${items.map(({ ex, pts }) => {
      const first = pts[0].w, last = pts[pts.length - 1].w, d = r1(last - first), best = Math.max(...pts.map(p => p.w)), isOpen = progOpen === ex.id;
      return `<div class="ex">
        <button class="ex-head" data-prog="${ex.id}" aria-expanded="${isOpen}">
          <span class="ex-main"><b>${esc(ex.ar)}</b><span class="ex-meta">آخر وزن <span class="wtag">${fmtW(last)}</span>${d > 0 ? ` · <span class="up">▲ ${d} كغ من البداية</span>` : d < 0 ? ` · ${-d} كغ أقل من البداية` : ""}</span></span>
          ${spark(pts)}
        </button>
        ${isOpen ? `<div class="ex-body">${weightChart(ex, pts)}<p class="small muted">أحسن وزن: <b class="wtag">${fmtW(best)}</b> · ${pts.length} ${pts.length === 1 ? "تسجيل" : "تسجيلات"}</p></div>` : ""}
      </div>`;
    }).join("")}</div>`;
  }
  html += `</section><p class="note">زيدي الوزن شوي شوي لمّا تقدري تعملي كل التكرارات بحركة صحيحة. هيدا اللي بيعمل التقدّم.</p>`;
  return html;
}

/* تلميح الأرقام عالرسوم (لمس أو ماوس) */
const $tip = document.createElement("div"); $tip.className = "tooltip"; $tip.hidden = true; $tip.setAttribute("role", "status"); document.body.appendChild($tip);
function showTip(el) {
  const r = el.getBoundingClientRect();
  $tip.textContent = el.dataset.tip; $tip.hidden = false;
  const w = $tip.offsetWidth, x = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2));
  $tip.style.left = x + "px"; $tip.style.top = Math.max(8, r.top - $tip.offsetHeight - 8) + "px";
  document.querySelectorAll(".c-hit.on").forEach(n => n.classList.remove("on")); el.classList.add("on");
}
function hideTip() { $tip.hidden = true; document.querySelectorAll(".c-hit.on").forEach(n => n.classList.remove("on")); }
document.addEventListener("pointerover", (e) => { const el = e.target.closest?.("[data-tip]"); if (e.pointerType === "mouse") el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", (e) => { const el = e.target.closest?.("[data-tip]"); el ? showTip(el) : hideTip(); });
window.addEventListener("scroll", hideTip, { passive: true });

/* ===================== وضع التمرين خطوة بخطوة ===================== */
let ses = store.get("tamrini.session", null);   // { day, date, idx, set, phase: work|hold|rest|done, until, started, sets, prs, showHow }
if (ses && (Date.now() - ses.started > 12 * 3600e3 || !buildDay(ses.day))) ses = null;   // جلسة قديمة
const $play = document.createElement("div");
$play.id = "play"; $play.dir = "rtl"; $play.lang = "ar"; $play.hidden = true;
$play.setAttribute("role", "dialog"); $play.setAttribute("aria-modal", "true"); $play.setAttribute("aria-label", "وضع التمرين");
document.body.appendChild($play);
const saveSes = () => store.set("tamrini.session", ses);

let audio = null, wake = null;
function beep() {
  try { navigator.vibrate?.([180, 90, 180]); } catch {}
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.16);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.18);
    });
  } catch {}
}
async function lockScreen() { try { if (ses && navigator.wakeLock && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (ses && ses.phase !== "done") lockScreen(); });

function sesItems() { return buildDay(ses.day).items; }
function nextUndone(from) {
  const items = sesItems();
  for (let k = 1; k <= items.length; k++) {
    const i = (from + k) % items.length;
    if (!(entry(ses.date, items[i].ex.id) || {}).done) return i;
  }
  return -1;
}
function startSession() {
  try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  const date = ymd(dateOfDay(selDay)), items = buildDay(selDay).items;
  const first = items.findIndex(it => !(entry(date, it.ex.id) || {}).done);
  ses = { day: selDay, date, idx: Math.max(0, first), set: 1, phase: "work", until: 0, started: Date.now(), sets: 0, prs: 0, showHow: false };
  saveSes(); lockScreen(); renderPlay();
}
function endSession() { ses = null; saveSes(); try { wake?.release(); } catch {} wake = null; renderPlay(); render(); }

function finishSet() {
  const items = sesItems(), it = items[ses.idx], n = setsFor(ses.day, it.ex);
  ses.sets++;
  if (ses.set < n) { ses.set++; ses.phase = "rest"; ses.until = Date.now() + REST_SEC[profile.goal] * 1000; }
  else {
    const e = entry(ses.date, it.ex.id) || {}, before = Math.max(0, ...weightsOf(it.ex.id).filter(x => x.d < ses.date).map(x => x.w));
    if (e.w && before && e.w > before) ses.prs++;
    setEntry(ses.date, it.ex.id, { done: true });
    const nx = nextUndone(ses.idx);
    if (nx < 0) { ses.phase = "done"; try { wake?.release(); } catch {} }
    else { ses.idx = nx; ses.set = 1; ses.phase = "rest"; ses.until = Date.now() + REST_SEC[profile.goal] * 1000; ses.showHow = false; }
  }
  saveSes(); renderPlay();
}
function afterRest() { ses.phase = "work"; ses.until = 0; saveSes(); renderPlay(); }

function bigRing(frac, txt, sub) {

    <div><b class="pl-time" aria-live="off">${txt}</b><span>${sub}</span></div></div>`;
}
function plWeight(ex) {

    </div>`;
}

function renderPlay() {
  if (!ses) { $play.hidden = true; $play.innerHTML = ""; document.body.classList.remove("playing"); return; }
  $play.hidden = false; document.body.classList.add("playing");
  const items = sesItems(), g = GOALS[profile.goal];
  const segs = `<div class="pl-segs" aria-hidden="true">${items.map((it, i) => `<i class="${(entry(ses.date, it.ex.id) || {}).done ? "f" : i === ses.idx && ses.phase !== "done" ? "c" : ""}"></i>`).join("")}</div>`;
  const doneN = items.filter(it => (entry(ses.date, it.ex.id) || {}).done).length;
  let body;
  if (ses.phase === "done") {
    const mins = Math.max(1, Math.round((Date.now() - ses.started) / 60000));
    body = `<div class="pl-main pl-end">
        <div class="pl-trophy">${CHECK}</div>

        <div class="tiles">
          <div class="tile"><span>الوقت</span><b>${mins}<em> د</em></b></div>
          <div class="tile"><span>تمارين</span><b>${doneN}<em>/${items.length}</em></b></div>
          <div class="tile"><span>مجموعات</span><b>${ses.sets}</b></div>
          <div class="tile"><span>أوزان جديدة</span><b>${ses.prs}</b><small>${ses.prs ? "رقم قياسي جديد! 💪" : "المرة الجاية زيدي شوي"}</small></div>
        </div>
      </div>
      <div class="pl-actions">
        <button class="start" data-pl="prog">شوفي تقدّمك</button>
        <button class="ghost wide" data-pl="close">رجعي عالبرنامج</button>
      </div>`;
  } else {
    const it = items[ses.idx], ex = it.ex, n = setsFor(ses.day, ex), hold = holdFor(ses.day, ex), uni = UNI.has(ex.id);
    if (ses.phase === "rest") {
      const left = Math.max(0, (ses.until - Date.now()) / 1000), tot = REST_SEC[profile.goal];
      const nextTxt = ses.set === 1 ? `التمرين الجايي: ${esc(ex.ar)}` : `الجاية: المجموعة ${ses.set} من ${n}`;
      body = `<div class="pl-main">
          <span class="pl-pill">راحة</span>
          ${bigRing(Math.min(1, left / tot), mmss(Math.ceil(left)), "خدي نفس واشربي مي")}
          <div class="pl-next">${avatar(ex)}<span><b>${nextTxt}</b><small class="muted">${it.isTime ? `${mmss(hold)} ثبات` : `${rng(g.reps)} تكرار`}${uni ? " · لكل جهة" : ""}</small></span></div>
        </div>
        <div class="pl-actions">
          <div class="pl-row"><button class="ghost wide" data-pl="more">+15 ث</button><button class="ghost wide" data-pl="next">تخطّي الراحة</button></div>
        </div>`;
    } else if (ses.phase === "hold") {
      const left = Math.max(0, (ses.until - Date.now()) / 1000);
      body = `<div class="pl-main">
          <span class="pl-pill">المجموعة ${ses.set} من ${n}</span>
          <h2 class="pl-name">${esc(ex.ar)}</h2>
          ${bigRing(Math.min(1, left / hold), mmss(Math.ceil(left)), uni ? "اثبتي · وبعدين بدّلي الجهة" : "اثبتي، فيكِ!")}
        </div>
        <div class="pl-actions"><button class="start" data-pl="set">✓ خلّصت</button></div>`;
    } else {
      body = `<div class="pl-main">
          ${avatar(ex, { big: true })}
          <div class="pl-head">
            <h2 class="pl-name">${esc(ex.ar)}</h2>
            <span class="pl-pill">المجموعة ${ses.set} من ${n}</span>
          </div>
          <div class="pl-target"><b>${it.isTime ? mmss(hold) : rng(g.reps)}</b><span>${it.isTime ? "ثبات" : "تكرار"}${uni ? " · لكل جهة" : ""}</span></div>
          ${plWeight(ex)}
          <details class="pl-how" ${ses.showHow ? "open" : ""}><summary>شو الحركة؟</summary>${exInfo(ex)}<a class="video" href="${video(ex)}" target="_blank" rel="noopener">▶ فيديو الشرح</a></details>
        </div>
        <div class="pl-actions">
          ${it.isTime ? `<button class="start" data-pl="hold">▶ ابدئي ${mmss(hold)}</button>` : `<button class="start" data-pl="set">✓ خلّصت المجموعة</button>`}
          <button class="ghost wide" data-pl="skip">تخطّي هالتمرين</button>
        </div>`;
    }
  }
  $play.innerHTML = `<div class="pl">
      <header class="pl-top">
        <button class="pl-x" data-pl="close" aria-label="سكّري وضع التمرين">✕</button>
        <span>${ses.phase === "done" ? "خلصنا!" : `تمرين ${ses.idx + 1} من ${items.length}`}</span>
        <span class="pl-x" aria-hidden="true"></span>
      </header>
      ${segs}
      ${body}
    </div>`;
}

// عدّاد الوقت: بيحدّث الرقم والدائرة بس، بلا ما يعيد رسم كل شي
setInterval(() => {
  if (!ses || (ses.phase !== "rest" && ses.phase !== "hold")) return;
  const left = (ses.until - Date.now()) / 1000;
  if (left <= 0) { beep(); ses.phase === "rest" ? afterRest() : finishSet(); return; }
  const tot = ses.phase === "rest" ? REST_SEC[profile.goal] : holdFor(ses.day, sesItems()[ses.idx].ex);
  const t = $play.querySelector(".pl-time"); if (t) t.textContent = mmss(Math.ceil(left));
  const v = $play.querySelector(".pl-ring .val"); if (v) { const c = 2 * Math.PI * 96; v.setAttribute("stroke-dashoffset", (c * (1 - Math.min(1, left / tot))).toFixed(1)); }
}, 250);

$play.addEventListener("click", (e) => {
  const t = e.target.closest("button, summary"); if (!t || !ses) return;
  if (t.tagName === "SUMMARY") { ses.showHow = !t.parentElement.open; saveSes(); return; }
  const a = t.dataset.pl, step = t.dataset.pwstep;
  if (step) {
    const id = sesItems()[ses.idx].ex.id, cur = (entry(ses.date, id) || {}).w ?? lastBefore(id, ses.date) ?? 0;
    setEntry(ses.date, id, { w: Math.max(0, Math.round((cur + +step) * 10) / 10) }); renderPlay(); return;
  }
  if (a === "set") finishSet();
  else if (a === "hold") { ses.phase = "hold"; ses.until = Date.now() + holdFor(ses.day, sesItems()[ses.idx].ex) * 1000; saveSes(); renderPlay(); }
  else if (a === "next") afterRest();
  else if (a === "more") { ses.until += 15000; saveSes(); renderPlay(); }
  else if (a === "skip") {
    const nx = nextUndone(ses.idx);
    if (nx < 0 || nx === ses.idx) { ses.phase = "done"; } else { ses.idx = nx; ses.set = 1; ses.phase = "work"; ses.showHow = false; }
    saveSes(); renderPlay();
  }
  else if (a === "prog") { tab = "prog"; endSession(); window.scrollTo(0, 0); }
  else if (a === "close") {
    if (ses.phase !== "done" && !confirm("بدّك توقفي التمرين؟ اللي خلّصتيه محفوظ.")) return;
    endSession();
  }
});
$play.addEventListener("input", (e) => {
  if (!e.target.dataset.pw || !ses) return;
  const v = parseFloat(e.target.value);
  setEntry(ses.date, e.target.dataset.pw, { w: v > 0 && v < 1000 ? v : undefined });
});

/* ===================== الأحداث ===================== */
document.addEventListener("click", (e) => {
  const tipEl = e.target.closest("[data-tip]");
  if (tipEl) { tipEl.classList.contains("on") && !$tip.hidden ? hideTip() : showTip(tipEl); return; }
  hideTip();
  const t = e.target.closest("button");
  if (!t) return;
  const ds = t.dataset;
  if (ds.done) {
    const date = ymd(dateOfDay(selDay)), was = !!(entry(date, ds.done) || {}).done;
    setEntry(date, ds.done, { done: !was });
    justDone = was ? null : ds.done;
    if (!was && open && open.startsWith("p-")) {          // افتحي التمرين الجايي يلي ما خلص
      const day = buildDay(selDay);
      const next = day.items.findIndex(it => !(entry(date, it.ex.id) || {}).done);
      open = next >= 0 ? `p-${selDay}-${next}` : null;
    }
    render(); justDone = null;
    if (open) document.querySelector(`[data-open="${open}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    return;
  }
  if (ds.wstep) {
    const date = ymd(dateOfDay(selDay)), id = ds.wid;
    const cur = (entry(date, id) || {}).w ?? lastBefore(id, date) ?? 0;
    setEntry(date, id, { w: Math.max(0, Math.round((cur + +ds.wstep) * 10) / 10) });
    render(); return;
  }
  if (ds.tab) { tab = ds.tab; open = null; if (tab === "me") draft = null; render(); window.scrollTo(0,0); return; }
  if (ds.start) { startSession(); return; }
  if (ds.adj) {
    const ex = EX.find(x => x.id === ds.aid), k = `${selDay}-${ds.aid}`, dir = +ds.dir;
    const v = ds.adj === "sets" ? Math.min(8, Math.max(1, setsFor(selDay, ex) + dir)) : Math.min(180, Math.max(10, holdFor(selDay, ex) + dir * 5));
    adj[k] = { ...(adj[k] || {}), [ds.adj]: v }; store.set("tamrini.adj", adj); render(); return;
  }
  if (ds.themeSet) { theme = ds.themeSet; store.set("tamrini.theme", theme); applyTheme(); render(); return; }
  if (ds.prog) { progOpen = progOpen === ds.prog ? "" : ds.prog; render(); return; }
  if (ds.open) { open = open === ds.open ? null : ds.open; render(); return; }
  if (ds.day) { selDay = +ds.day; open = null; render(); return; }
  if (ds.eq) { dayEq[selDay] = ds.eq; store.set("tamrini.dayEq", dayEq); open = null; render(); return; }
  if (ds.swap) { swaps[ds.swap] = (swaps[ds.swap] || 0) + 1; store.set("tamrini.swaps", swaps); render(); return; }
  if (ds.part) { lib.part = ds.part; render(); return; }
  if (ds.leq) { lib.eq = ds.leq; render(); return; }
  if (ds.goal) { draft.goal = ds.goal; render(); return; }
  if (ds.level) { draft.level = ds.level; render(); return; }
  if (ds.feq) { draft.eq = ds.feq; render(); return; }
  if (ds.fday) {
    const i = +ds.fday, s = new Set(draft.days);
    if (s.has(i)) s.delete(i); else if (s.size < 6) s.add(i);
    draft.days = [...s].sort((a,b) => a-b); render(); return;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "lib-q") {
    lib.q = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById("lib-q"); el.focus(); try { el.setSelectionRange(pos, pos); } catch {}
  }
  if (e.target.dataset.w) {
    const v = parseFloat(e.target.value);
    setEntry(ymd(dateOfDay(selDay)), e.target.dataset.w, { w: v > 0 && v < 1000 ? v : undefined });
    return;
  }
  if (e.target.id === "f-age") draft.age = +e.target.value;
  if (e.target.id === "f-weight") draft.weight = +e.target.value;
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "me-form") return;
  e.preventDefault();
  const err = document.getElementById("me-err");
  const bad = !(draft.age >= 12 && draft.age <= 90) ? "اكتبي عمر بين ١٢ و٩٠."
    : !(draft.weight >= 30 && draft.weight <= 250) ? "اكتبي وزن بين ٣٠ و٢٥٠ كغ."
    : !draft.days.length ? "اختاري يوم تمرين واحد عالأقل." : "";
  if (bad) { err.textContent = bad; err.hidden = false; return; }
  profile = { ...draft, saved: true };
  store.set("tamrini.profile", profile);
  dayEq = {}; swaps = {}; adj = {}; store.set("tamrini.dayEq", dayEq); store.set("tamrini.swaps", swaps); store.set("tamrini.adj", adj);
  selDay = profile.days.includes(todayIdx) ? todayIdx : profile.days[0];
  tab = "plan"; open = null; render(); window.scrollTo(0,0);
});

render();
if (ses) { renderPlay(); lockScreen(); }
</script>
